name: GraphQL API Tests

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]
    workflow_dispatch:
    schedule:
        - cron: '15 6 * * *'

jobs:
    test:
        name: Run GraphQL Test Suite
        timeout-minutes: 30
        runs-on: ubuntu-latest
        
        steps:
            # ─── Checkout & Node Setup ────────────────────────────────────
            - name: Checkout code
              uses: actions/checkout@v5
            
            - name: Setup Node.js
              uses: actions/setup-node@v5
              with:
                node-version: lts/*
                cache: 'npm'

            # ─── Install ──────────────────────────────────────────────────
            - name: Install dependencies
              run: npm ci

            # ─── Run Tests ────────────────────────────────────────────────
            # IMPORTANT: use `npm test`, NOT `npx jest`.
            # The test script in package.json includes the
            # --experimental-vm-modules flag required for ESM support.
            - name: Run tests
              run: mkdir -p results && npm test -- --json --outputFile=results/jest.json
              env:
                # Exposes the built-in GITHUB_TOKEN so the GitHub API
                # authentication tests can run in CI.
                # Scopes are read-only by default for pull_request events;
                # push events on the default branch receive read+write.
                GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                # Explicitly signal CI environment to Jest
                CI: "true"

            # ─── Coverage ─────────────────────────────────────────────────
            - name: Run test with coverage
              if: github.event_name != 'schedule'
              run: npm run test:coverage
              env:
                GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                CI: "true"

            # ─── Artifacts ────────────────────────────────────────────────
            - name: Upload coverage report
              uses: actions/upload-artifact@v4
              if: ${{ !cancelled() }}
              with:
                name: coverage-report
                path: coverage/
                retention-days: 14

            - name: Upload HTML test report
              uses: actions/upload-artifact@v4
              if: ${{ !cancelled() }}
              with:
                name: html-test-report
                path: html-report/
                retention-days: 14

            - name: Upload results for unified-test-reporting
              uses: actions/upload-artifact@v4
              if: ${{ !cancelled() }}
              with:
                name: utr-results
                path: results/jest.json
                retention-days: 90
                if-no-files-found: error
